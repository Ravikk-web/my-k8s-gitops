apiVersion: apps/v1
kind: Deployment
metadata:
  name: webernetes-app
  namespace: app-webernetes
  labels:
    app: webernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webernetes
  template:
    metadata:
      labels:
        app: webernetes
    spec:
      # Pinned to the general worker node
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: webernetes
          image: testravikk/webernetes-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: webernetes-service
  namespace: app-webernetes
spec:
  type: NodePort
  selector:
    app: webernetes
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 # Exposes port 30080 mapped in your Kind cluster config