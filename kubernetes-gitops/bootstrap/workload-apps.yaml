apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-apps
  namespace: argocd
spec:
  project: default
  source:
    # Update this exact line:
    repoURL: 'https://github.com/Ravikk-web/my-k8s-gitops.git'
    targetRevision: HEAD
    path: kubernetes-gitops/apps
    directory: 
      recurse: true # <--- Forces Argo CD to read YAMLs in subfolders
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true